name: Deploy Fellowshipper to GCP Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Verify & Deploy SPWA + Security Rules to GCP Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests & linter
        run: |
          npm test
          npm run lint

      - name: Resolve Firebase Web SDK & OAuth config from GCP
        id: fb_env
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/ci-resolve-firebase-env.mjs

      - name: Build production PWA bundle
        run: npm run build

      - name: Deploy Firestore Rules, RTDB Rules & Hosting to GCP Firebase
        if: steps.fb_env.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ steps.fb_env.outputs.project_id }}
        run: |
          CRED_FILE="$(mktemp /tmp/fb-sa-XXXXXX.json)"
          trap 'rm -f "$CRED_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CRED_FILE"
          GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE" npx --yes firebase-tools deploy \
            --project "$PROJECT_ID" \
            --only firestore:rules,database,hosting
